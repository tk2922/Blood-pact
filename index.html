<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Pact Game Documents</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(to bottom, #0d0d0d, #1a0000);
            color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #800000;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #fff0f0;
            text-shadow: 2px 2px 5px #000;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            border-bottom: 2px solid #ff0000;
            padding-bottom: 5px;
            color: #ffcccc;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: rgba(44, 0, 0, 0.8);
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 10px;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        li:hover {
            transform: translateX(10px);
            background-color: rgba(128, 0, 0, 0.9);
        }

        li::before {
            content: "📄 ";
        }

        .pdf::before {
            content: "📑 ";
        }

        .ppt::before {
            content: "📊 ";
        }

        a {
            color: inherit;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blood Pact Game Documents</h1>
    </header>
    <main>

        <!-- Word Documents -->
        <section>
            <h2>Word Documents</h2>
            <ul>
                <li><a href="Blood%20Pact%20game%20idea.docx">Blood Pact game idea</a></li>
                <li><a href="MeetingNotes.docx">MeetingNotes</a></li>
                <li><a href="Simple%20rules.docx">Simple rules</a></li>
            </ul>
        </section>

        <!-- PDF Documents -->
        <section>
            <h2>PDF Documents</h2>
            <ul>
                <li class="pdf"><a href="FinalGameDocument.pdf">Final Game document</a></li>
                <li class="pdf"><a href="FindingsandFeedback.pdf">Findings and Feedback</a></li>
                <li class="pdf"><a href="FirstPlayable.pdf">First Playable</a></li>
                <li class="pdf"><a href="high%20concept.pdf">High Concept</a></li>
            </ul>
        </section>

        <!-- Presentation (Google Slides link fixed) -->
        <section>
            <h2>Presentation</h2>
            <ul>
                <li class="ppt">
                    <a href="https://docs.google.com/presentation/d/1E86FI0esYumzJXvn7CmcHWgzKEO17oBL/view?usp=sharing" target="_blank">
                        Blood Pact Presentation
                    </a>
                </li>
            </ul>
        </section>

    </main>
</body>
</html>
