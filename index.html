<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Pact Game Documents</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(to bottom, #0d0d0d, #1a0000);
            color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #800000;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #fff0f0;
            text-shadow: 2px 2px 5px #000;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            border-bottom: 2px solid #ff0000;
            padding-bottom: 5px;
            color: #ffcccc;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: rgba(44, 0, 0, 0.8);
            margin: 10px 0;
            padding: 15px 20px;
            border-radius: 10px;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        li:hover {
            transform: translateX(10px);
            background-color: rgba(128, 0, 0, 0.9);
        }

        li::before {
            content: "📑 ";
        }

        a {
            color: inherit;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Blood Pact Game Documents</h1>
    </header>
    <main>
        <section>
            <h2>PDF Documents</h2>
            <ul>
                <li><a href="Final%20Game%20document.pdf">Final Game document</a></li>
                <li><a href="First%20playable%20findings%20and%20feedback.pdf">First playable findings and feedback</a></li>
                <li><a href="ART%20311_Playable_Epic%20Gamers.pdf">ART 311_Playable_Epic Gamers</a></li>
                <li><a href="high%20concept.pdf">high concept</a></li>
            </ul>
        </section>
    </main>
</body>
</html>
